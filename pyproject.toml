[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-multi-cli"
version = "0.1.0"
description = "Мессенджер для мастеров: заявки и переписка с клиентами из Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.7,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.gui-scripts]
chat-multi-cli = "chat_multi_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_multi_cli"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "src/chat_multi_cli/ui/resources"]
addopts = "-q --strict-markers"